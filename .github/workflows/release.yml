name: Build and release BlindPilot

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-2025
            asset: BlindPilot-Windows-x64.zip
            kind: windows
          - label: macOS Apple Silicon
            runner: macos-15
            asset: BlindPilot-macOS-arm64.zip
            kind: macos
          - label: macOS Intel
            runner: macos-15-intel
            asset: BlindPilot-macOS-x64.zip
            kind: macos
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-build.txt

      - name: Run regression tests
        run: python -m pytest -q -W error

      - name: Run static checks
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Compile source
        run: python -m py_compile blind_pilot.py blindpilot_app.py app_updater.py claude_reader.py agent_backends.py markdown_rows.py

      - name: Build Windows application
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name BlindPilot --add-data "EarCons;EarCons" --collect-submodules accessible_output2 --hidden-import winpty blind_pilot.py
          & .\dist\BlindPilot\BlindPilot.exe --startup-smoke
          if ($LASTEXITCODE -ne 0) { throw "Packaged startup smoke test failed: $LASTEXITCODE" }
          & .\dist\BlindPilot\BlindPilot.exe --startup-gui-smoke
          if ($LASTEXITCODE -ne 0) { throw "Packaged GUI startup smoke test failed: $LASTEXITCODE" }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path dist\BlindPilot -DestinationPath "artifacts\${{ matrix.asset }}" -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "artifacts\${{ matrix.asset }}").Hash.ToLowerInvariant()
          Set-Content -Encoding ascii -NoNewline -LiteralPath "artifacts\${{ matrix.asset }}.sha256" -Value "$hash  ${{ matrix.asset }}"

      - name: Build macOS application
        if: matrix.kind == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name BlindPilot --osx-bundle-identifier com.serrebidev.blindpilot --add-data "EarCons:EarCons" --hidden-import pexpect blind_pilot.py
          codesign --force --deep --sign - dist/BlindPilot.app
          dist/BlindPilot.app/Contents/MacOS/BlindPilot --startup-smoke
          dist/BlindPilot.app/Contents/MacOS/BlindPilot --startup-gui-smoke
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent dist/BlindPilot.app "artifacts/${{ matrix.asset }}"
          cd artifacts
          shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"

      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download build outputs
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum --check *.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "BlindPilot ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
